<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 我的直播间</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{
  --bg:#0d0d12; --panel:#16161e; --panel2:#1e1e2a; --border:#2a2a38;
  --text:#fff; --muted:#999; --accent:#fb7299; --gold:#ffd700;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}

.app{display:flex;height:100vh;width:100%;}
.video-area{flex:1;position:relative;background:#000;min-width:0;display:flex;flex-direction:column;}
.video-container{position:relative;flex:1;overflow:hidden;}
#video{width:100%;height:100%;object-fit:contain;background:#000;}

.danmaku-layer{position:absolute;top:0;left:0;right:0;height:65%;pointer-events:none;overflow:hidden;z-index:5;}
.danmaku-item{position:absolute;white-space:nowrap;font-size:17px;font-weight:500;text-shadow:0 1px 4px #000,0 0 6px #000;animation:dmMove linear forwards;}
@keyframes dmMove{from{transform:translateX(100%);}to{transform:translateX(-100%);}}


.live-overlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:26px;font-weight:700;color:#ff5b5b;line-height:1.5;}
.gift-overlay{position:absolute;top:7%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:20;}
.gift-anim{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(255,80,80,.8),rgba(255,180,60,.8));padding:10px 22px;border-radius:40px;font-size:16px;font-weight:600;box-shadow:0 0 18px rgba(255,150,50,.4);animation:pop .35s ease-out;}
  .gift-anim.ga-fade{opacity:0;transition:opacity .5s ease;}
@keyframes pop{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}

.top-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:12px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);display:flex;justify-content:space-between;align-items:center;}
.stream-title{font-size:16px;font-weight:600;}
.stream-info{display:flex;gap:10px;align-items:center;}
.badge{background:#e63946;padding:4px 10px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:5px;}
.viewer-badge{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-size:12px;}
.live-dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.sound-btn{position:absolute;bottom:16px;right:16px;z-index:15;width:46px;height:46px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sound-btn.on{background:var(--accent);}
.ctrl-btn{position:absolute;right:16px;z-index:15;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#dmToggleBtn{bottom:70px;}
#fsBtn{bottom:122px;}


.sidebar{width:360px;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--border);}
body.fs .sidebar{display:none !important;}
body.fs .video-area{width:100% !important;}
body.fs .ctrl-btn,body.fs .sound-btn,body.fs .top-bar{opacity:1;}
.fs-chat{position:fixed;right:16px;top:64px;bottom:84px;width:250px;max-width:34vw;background:rgba(20,20,28,.92);border:1px solid #2a2a38;border-radius:12px;display:flex;flex-direction:column;z-index:200;overflow:hidden;}
.fs-chat .fsc-head{padding:10px 14px;font-size:14px;font-weight:600;border-bottom:1px solid #2a2a38;}
.fs-chat .fsc-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
.fs-chat .fsc-msgs .chat-msg{font-size:13px;line-height:1.4;}
.fs-chat .fsc-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #2a2a38;}
.fs-chat .fsc-input-row input{flex:1;background:#1e1e2a;border:1px solid #2a2a38;border-radius:16px;color:#fff;padding:8px 12px;outline:none;}
.fs-chat .fsc-input-row button{background:#fb7299;border:none;color:#fff;border-radius:16px;padding:0 16px;cursor:pointer;}
body.fs #chatToggleBtn{display:flex !important;}
#chatToggleBtn{display:none;bottom:222px;}

.chat-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.chat-header h3{font-size:15px;}
.balance-box{background:linear-gradient(135deg,#ffd700,#ff9500);color:#111;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;}
.chat-messages{flex:1;overflow-y:auto;padding:12px 14px;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
.chat-msg{margin-bottom:9px;font-size:13.5px;line-height:1.5;word-break:break-all;}
.chat-msg .name{font-weight:600;margin-right:6px;}
.chat-msg.system{color:var(--muted);font-size:12px;text-align:center;}
.chat-input-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);}
.chat-input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:9px 14px;color:#fff;font-size:14px;outline:none;}
.chat-input:focus{border-color:var(--accent);}
.btn-send{background:var(--accent);border:none;color:#fff;padding:0 18px;border-radius:18px;cursor:pointer;font-size:14px;}
.gift-panel{padding:10px 14px 14px;border-top:1px solid var(--border);}
.gift-panel h4{font-size:13px;color:var(--muted);margin-bottom:8px;}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gift-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:.15s;}
.gift-item:hover{border-color:var(--gold);}
.gift-icon{font-size:26px;}
.gift-name{font-size:12px;margin-top:3px;color:#ccc;}
.gift-price{font-size:11px;color:var(--gold);margin-top:2px;}

.viewer-box{padding:10px 14px;border-bottom:1px solid var(--border);}
.viewer-box-title{font-size:12px;color:var(--muted);margin-bottom:8px;}
.viewer-list{display:flex;flex-wrap:wrap;gap:6px;max-height:96px;overflow-y:auto;}
.viewer-chip{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:4px 10px;border-radius:16px;font-size:12.5px;}
.viewer-ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#00cec9);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;}
.viewer-empty{font-size:12px;color:#666;}
.mviewer-list{max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.mviewer-row{display:flex;align-items:center;gap:10px;padding:9px 6px;font-size:14px;border-bottom:1px solid #26263a;}
.owner-tag{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:var(--panel);padding:32px;border-radius:18px;text-align:center;width:min(360px,90vw);}
.modal h2{margin-bottom:18px;font-size:20px;}
.modal input{width:100%;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:16px;text-align:center;outline:none;margin-bottom:14px;}
.modal .primary{width:100%;padding:12px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;}
.modal .ghost{width:100%;padding:11px;background:#333;border:none;border-radius:10px;color:#fff;font-size:15px;cursor:pointer;margin-top:8px;}
.recharge-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.recharge-amount{background:var(--panel2);border:2px solid var(--border);border-radius:10px;padding:12px 6px;cursor:pointer;}
.recharge-amount.selected{border-color:var(--gold);background:rgba(255,215,0,.1);}
.recharge-amount .num{font-size:19px;font-weight:700;color:var(--gold);}
.recharge-amount .label{font-size:11px;color:var(--muted);margin-top:3px;}
.pay-methods{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.pay-method{flex:1;padding:11px 4px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-size:12px;}
.pay-method.selected{border-color:#07c160;background:rgba(7,193,96,.1);}
.pay-method .icon{font-size:22px;}

.mobile-chat-overlay,.mobile-bottombar{display:none;}

.m-gift-toasts{position:absolute;top:14%;left:50%;transform:translateX(-50%);z-index:25;display:flex;flex-direction:column;gap:6px;pointer-events:none;}

@media (max-width:768px){
  .sidebar{display:none;}
  .danmaku-item{font-size:14px !important;}
  .sound-btn{bottom:78px !important;right:14px !important;width:42px !important;height:42px !important;font-size:18px !important;}
  #dmToggleBtn{right:14px !important;bottom:128px !important;width:40px !important;height:40px !important;font-size:16px !important;}
  #fsBtn{right:14px !important;bottom:178px !important;width:40px !important;height:40px !important;font-size:17px !important;}
  .viewer-badge{cursor:pointer;}
  .mobile-chat-overlay{display:block;position:absolute;left:0;right:0;bottom:120px;top:auto;z-index:8;padding:0 14px;pointer-events:none;}
  .m-chat-messages{max-height:26vh;overflow-y:auto;overflow-x:hidden;pointer-events:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;mask-image:linear-gradient(to top,#000 50%,transparent);-webkit-mask-image:linear-gradient(to top,#000 50%,transparent);}
  .m-chat-messages::-webkit-scrollbar{width:0;}
  .m-chat-messages .chat-msg{display:table;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);padding:5px 12px;border-radius:16px;margin-bottom:6px;max-width:85%;font-size:12.5px;line-height:1.4;}
  .m-chat-messages .chat-msg .name{color:var(--gold);}
  .gift-anim{padding:8px 18px !important;font-size:13px !important;gap:6px !important;border-radius:30px !important;}
  .mobile-bottombar{display:flex;position:absolute;left:10px;right:10px;bottom:12px;z-index:30;gap:8px;align-items:center;}
  .m-input{flex:1;background:rgba(20,20,28,.7);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:24px;padding:11px 18px;color:#fff;font-size:14px;outline:none;}
  .m-input:focus{border-color:var(--accent);}
  .m-gift-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(20,20,28,.7);backdrop-filter:blur(16px);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .m-send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;}
  .mobile-gift-sheet{position:fixed;inset:0;z-index:1100;display:none;}
  .mgs-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);}
  .mgs-panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1a1a22,#131319);border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
  .mgs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:16px;font-weight:600;}
  .mgs-balance{color:var(--gold);font-size:13px;cursor:pointer;background:rgba(255,210,94,.1);padding:4px 12px;border-radius:12px;}
  .mgs-close{font-size:22px;color:var(--muted);cursor:pointer;}
  .mgs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .mgs-grid .gift-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:14px 4px;text-align:center;cursor:pointer;}
}
</style>
</head>
<body>

<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>🎮 登录直播间</h2>
    <input type="text" id="usernameInput" placeholder="用户名" maxlength="30" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="密码" maxlength="60" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary" onclick="doLogin()">登录</button>
    <div style="margin-top:10px;font-size:12px;color:#999;">账号由管理员分发</div>
  </div>
</div>

<div class="modal-overlay" id="rechargeModal" style="display:none;">
  <div class="modal">
    <h2>💰 充值代币</h2>
    <div class="recharge-options" id="rechargeOptions">
      <div class="recharge-amount" data-amount="10"><div class="num">10</div><div class="label">10代币</div></div>
      <div class="recharge-amount selected" data-amount="50"><div class="num">50</div><div class="label">50代币</div></div>
      <div class="recharge-amount" data-amount="100"><div class="num">100</div><div class="label">100代币</div></div>
      <div class="recharge-amount" data-amount="500"><div class="num">500</div><div class="label">500代币</div></div>
      <div class="recharge-amount" data-amount="1000"><div class="num">1000</div><div class="label">1000代币</div></div>
      <div class="recharge-amount" data-amount="5200"><div class="num">5200</div><div class="label">5200代币</div></div>
    </div>
    <div class="pay-methods">
      <div class="pay-method selected" data-method="wechat"><div class="icon">💚</div>微信</div>
      <div class="pay-method" data-method="alipay"><div class="icon">🔷</div>支付宝</div>
      <div class="pay-method" data-method="bank"><div class="icon">🏦</div>网银</div>
    </div>
    <button class="primary" onclick="doRecharge(this)">确认充值</button>
    <button class="ghost" onclick="closeRecharge()">取消</button>
  </div>
</div>

<div class="app">
  <div class="video-area">
    <div class="video-container">
      <video id="video" playsinline></video>
      <div class="danmaku-layer" id="danmakuLayer"></div>
      <div class="live-overlay" id="liveOverlay" style="display:none;"></div>
      <div class="gift-overlay" id="giftOverlay"></div>
      <div class="top-bar">
        <div class="stream-title">🎮 主播正在直播</div>
        <div class="stream-info">
          <span class="badge"><span class="live-dot"></span>LIVE</span>
          <span class="viewer-badge" id="viewerBadge" onclick="openMobileViewers()">👤 <span id="viewerCount">0</span></span>
        </div>
      </div>
      <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</button>
      <button class="ctrl-btn" id="dmToggleBtn" onclick="toggleDanmaku()">💬</button>
      <button class="ctrl-btn" id="fsBtn" onclick="toggleFullscreen()">⛶</button>
      <button class="ctrl-btn" id="chatToggleBtn" onclick="toggleFsChat()">💬</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="chat-header">
      <h3>💬 互动区</h3>
      <div class="balance-box" onclick="openRecharge()">💎 <span id="balance">0</span> | 充值</div>
    </div>
    <div class="viewer-box">
      <div class="viewer-box-title">🔥 在线观众（<span id="viewerCountSide">0</span>）</div>
      <div class="viewer-list" id="viewerList"></div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="danmakuInput" placeholder="说点什么..." maxlength="200">
      <button class="btn-send" onclick="sendDanmaku()">发送</button>
    </div>
    <div class="gift-panel">
      <h4>🎁 送礼物</h4>
      <div class="gift-grid" id="giftGrid"></div>
    </div>
  </div>
</div>

<div class="mobile-chat-overlay" id="mobileChat">
  <div class="m-chat-messages" id="mobileChatMessages"></div>
</div>
<div class="m-gift-toasts" id="mGiftToasts"></div>
<div class="mobile-bottombar" id="mobileBottom">
  <input type="text" class="m-input" id="mobileInput" placeholder="说点什么..." maxlength="200">
  <button class="m-gift-btn" onclick="openMobileGifts()">🎁</button>
  <button class="m-send-btn" onclick="sendMobileDanmaku()">发送</button>
</div>

<div class="mobile-gift-sheet" id="mobileGiftSheet" style="display:none;">
  <div class="mgs-mask" onclick="closeMobileGifts()"></div>
  <div class="mgs-panel">
    <div class="mgs-head">
      <span>🎁 送礼物</span>
      <span class="mgs-balance" onclick="openRecharge()">💎 <span id="mBalance">0</span></span>
      <span class="mgs-close" onclick="closeMobileGifts()">✕</span>
    </div>
    <div class="mgs-grid" id="mGiftGrid"></div>
  </div>
</div>

<div class="mobile-gift-sheet" id="mViewerSheet" style="display:none;">
  <div class="mgs-mask" onclick="closeMobileViewers()"></div>
  <div class="mgs-panel">
    <div class="mgs-head">
      <span>🔥 在线观众</span>
      <span class="mgs-close" onclick="closeMobileViewers()">✕</span>
    </div>
    <div class="mviewer-list" id="mViewerList"></div>
  </div>
</div>

<script>
let userId=null,userName='',hls=null,webRtcReader=null;
let selectedRechargeAmount=50,selectedPayMethod='wechat';
let muted=true;

document.getElementById('danmakuInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendDanmaku();});
document.getElementById('mobileInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMobileDanmaku();});
document.querySelectorAll('.recharge-amount').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.recharge-amount').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');selectedRechargeAmount=+el.dataset.amount;
});
document.querySelectorAll('.pay-method').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.pay-method').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');selectedPayMethod=el.dataset.method;
});

async function checkRoomState(){try{const r=await fetch('/api/room-state');const d=await r.json();if(d.data&&d.data.stopped){stopStream();showLiveOverlay(d.data.message||'直播间已下播');}}catch(e){}}
function showLiveOverlay(msg){const o=document.getElementById('liveOverlay');o.textContent=msg;o.style.display='flex';}
function hideLiveOverlay(){const o=document.getElementById('liveOverlay');o.style.display='none';}
function stopStream(){const v=document.getElementById('video');try{v.pause();v.srcObject=null;v.removeAttribute('src');v.load();}catch(e){}if(window.hls){try{hls.destroy();}catch(e){}}}
let authToken=null;
function authH(){return {'Authorization':'Bearer '+authToken};}
async function doLogin(){
  const u=document.getElementById('usernameInput').value.trim();
  const pw=document.getElementById('passwordInput').value;
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:pw})});
  const d=await res.json();
  if(d.code===0){
    authToken=d.data.token;userName=d.data.username;
    setBalances(d.data.tokens);
    document.getElementById('loginModal').style.display='none';
    initStream();initSSE();loadGifts();checkRoomState();
    addMsg('chatMessages','系统',`欢迎 ${userName} 进入直播间`,true);
    addMsg('mobileChatMessages','系统',`欢迎 ${userName} 进入直播间`,true);
  }else{
    alert(d.msg||'登录失败');
  }
}
window.addEventListener('load',()=>{/*每次刷新都重新登录*/});

async function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
}

async function initStream(){
  const res=await fetch('/api/stream');const d=await res.json();
  const host=location.hostname;
  const video=document.getElementById('video');
  video.muted=true;
  // 优先 WebRTC（lowlatency 流：H264+Opus，亚秒延迟，有声有画）
  try{
    await loadScript(`http://${host}:8889/lowlatency/reader.js`);
    if(window.MediaMTXWebRTCReader){
      await new Promise((resolve,reject)=>{
        let settled=false;
        const fb=()=>{if(!settled){settled=true;reject(new Error('webrtc failed'));}};
        webRtcReader=new MediaMTXWebRTCReader({
          url:`http://${host}:8889/lowlatency/whep`,
          onError:fb,
          onTrack:(evt)=>{
            if(settled)return;
            video.srcObject=evt.streams[0];
            video.play().then(()=>{settled=true;resolve();}).catch(fb);
          }
        });
        setTimeout(fb,8000);
      });
      console.log('WebRTC lowlatency connected');return;
    }
  }catch(e){console.warn('WebRTC failed, fallback HLS',e);}
  if(hls){try{hls.destroy();}catch(_){}}
  video.srcObject=null;
  // 兜底 HLS（stream/test，AAC 音频，2~3 秒延迟）
  if(Hls.isSupported()){
    hls=new Hls({maxLiveSyncPlaybackRate:1.5,liveSyncDurationCount:2,liveMaxLatencyDurationCount:4});
    hls.loadSource(d.data.hls);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=d.data.hls;video.play().catch(()=>{});
  }
}

let dmOn=true;
function toggleDanmaku(){
  dmOn=!dmOn;
  const layer=document.getElementById('danmakuLayer');
  layer.style.display=dmOn?'':'none';
  document.getElementById('dmToggleBtn').style.opacity=dmOn?1:.4;
}
function toggleFullscreen(){
  const el=document.documentElement;
  if(!document.fullscreenElement){
    const fn=el.requestFullscreen||el.webkitRequestFullscreen; if(fn)fn.call(el);
  }else{
    const fn=document.exitFullscreen||document.webkitExitFullscreen; if(fn)fn.call(document);
  }
}
function syncFs(){
  const fs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  document.body.classList.toggle('fs',fs);
  if(!fs){const pc=document.getElementById('fsChat');if(pc)pc.style.display='none';}
  const b=document.getElementById('fsBtn'); if(b)b.textContent=fs?'↚':'⛶';
}
document.addEventListener('fullscreenchange',syncFs);
function toggleFsChat(){
  const el=document.getElementById('fsChat');
  el.style.display=(el.style.display==='flex')?'none':'flex';
}
function sendFsDanmaku(){
  const i=document.getElementById('fsInput');const t=i.value.trim();
  if(t&&postDanmaku(t))i.value='';
}

document.addEventListener('webkitfullscreenchange',syncFs);
function toggleSound(){
  const video=document.getElementById('video');
  muted=!muted;video.muted=muted;
  document.getElementById('soundBtn').textContent=muted?'🔇':'🔊';
  document.getElementById('soundBtn').classList.toggle('on',!muted);
  if(!muted)video.play().catch(()=>{});
}

function initSSE(){
  const es=new EventSource(`/api/events?token=${encodeURIComponent(authToken)}`);
  es.addEventListener('viewers',e=>{
    const d=JSON.parse(e.data);
    document.getElementById('viewerCount').textContent=d.count;
    const side=document.getElementById('viewerCountSide');if(side)side.textContent=d.count;
    renderViewers(d.list);
  });
  es.addEventListener('danmaku',e=>{
    const d=JSON.parse(e.data);
    addMsg('chatMessages',d.name,d.text,false,d.color);
    addMsg('mobileChatMessages',d.name,d.text,false,d.color);
    if(dmOn!==false)addDanmaku(d.name,d.text,d.color);
  });
  es.addEventListener('gift',e=>{
    const d=JSON.parse(e.data);
    addMsg('chatMessages',d.name,`送出 ${d.giftIcon} ${d.giftName} 💎${d.price}`,false,'#ffd700');
    showMGiftToast(d);
    showGiftAnim(d);setBalances(d.tokens);
  });
  es.addEventListener('recharge',e=>{
    const d=JSON.parse(e.data);
    addMsg('chatMessages','系统',`${d.name} 充值 ${d.amount} 代币`,true);
    setBalances(d.tokens);
  });
  es.addEventListener('warn',e=>{const d=JSON.parse(e.data);alert('⚠️ '+d.message);});
  es.addEventListener('roomwarn',e=>{const d=JSON.parse(e.data);showLiveOverlay('⚠️ '+d.message);});
  es.addEventListener('roomstate',e=>{const d=JSON.parse(e.data);if(d.stopped){stopStream();showLiveOverlay(d.message||'直播间已下播');}else{hideLiveOverlay();initStream();}});
  es.addEventListener('roomstop',e=>{const d=JSON.parse(e.data);stopStream();showLiveOverlay(d.message||'直播间已下播');});
  es.addEventListener('roomresume',()=>{hideLiveOverlay();initStream();});
  es.addEventListener('banned',e=>{try{es.close();}catch(e){}stopStream();showLiveOverlay('🚫 '+d.message);});
  es.addEventListener('kicked',e=>{try{es.close();}catch(e){}const d=JSON.parse(e.data);stopStream();showLiveOverlay(d.message||'你已被管理员请出直播间');});
  es.addEventListener('system',e=>{
    const d=JSON.parse(e.data);
    if(d.type==='join'){addMsg('chatMessages','系统',`${d.name} 进入直播间`,true);addMsg('mobileChatMessages','系统',`${d.name} 进入直播间`,true);}
  });
}

async function loadGifts(){
  const res=await fetch('/api/gifts');const d=await res.json();
  for(const[gid,g] of Object.entries(d.data)){
    const a=document.createElement('div');
    a.className='gift-item';a.innerHTML=`<div class="gift-icon">${g.icon}</div><div class="gift-name">${g.name}</div><div class="gift-price">💎${g.price}</div>`;
    a.onclick=()=>sendGift(gid);
    document.getElementById('giftGrid').appendChild(a);
    const b=a.cloneNode(true);b.onclick=()=>sendGift(gid);
    document.getElementById('mGiftGrid').appendChild(b);
  }
}

async function sendGift(gid){
  const res=await fetch('/api/gift',{method:'POST',headers:{'Content-Type':'application/json',...authH()},body:JSON.stringify({giftId:gid})});
  const d=await res.json();if(d.code!==0)alert(d.msg);
}

async function postDanmaku(text){
  const res=await fetch('/api/danmaku',{method:'POST',headers:{'Content-Type':'application/json',...authH()},body:JSON.stringify({text})});
  return res.ok;
}
async function sendDanmaku(){const i=document.getElementById('danmakuInput');const t=i.value.trim();if(t&&await postDanmaku(t))i.value='';}
async function sendMobileDanmaku(){const i=document.getElementById('mobileInput');const t=i.value.trim();if(t&&await postDanmaku(t))i.value='';}

function setBalances(t){document.getElementById('balance').textContent=t;document.getElementById('mBalance').textContent=t;}

function renderViewers(list){
  const side=document.getElementById('viewerList');
  if(side){
    side.innerHTML = list.length ? list.map((v,i)=>`<div class="viewer-chip"><span class="viewer-ava">${(v.name||'?')[0].toUpperCase()}</span><span>${esc(v.name)}</span></div>`).join('') : '<div class="viewer-empty">暂无观众</div>';
  }
  const ms=document.getElementById('mViewerList');
  if(ms){
    ms.innerHTML = list.length ? list.map((v,i)=>`<div class="mviewer-row"><span class="viewer-ava">${(v.name||'?')[0].toUpperCase()}</span><span>${esc(v.name)}</span>${i===0?'<span class="owner-tag">主播</span>':''}</div>`).join('') : '<div class="viewer-empty">暂无观众</div>';
  }
}
function openMobileViewers(){
  const el=document.getElementById('mViewerSheet');
  el.style.cssText='display:block;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.7);';
  const p=el.querySelector('.mgs-panel');
  p.style.cssText='display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;max-width:90vw;background:#16161e;border:1px solid #2a2a38;border-radius:14px;padding:16px;z-index:99999;';
  const h=p.querySelector('.mgs-head'); if(h)h.style.color='#fff';
  p.querySelectorAll('.mviewer-row').forEach(r=>r.style.color='#fff');
}
function closeMobileViewers(){document.getElementById('mViewerSheet').style.display='none';}
function addMsg(boxId,name,text,isSys,color){
  const box=document.getElementById(boxId);if(!box)return;
  const nearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;
  const div=document.createElement('div');
  div.className='chat-msg'+(isSys?' system':'');
  if(isSys)div.textContent=text;
  else div.innerHTML=`<span class="name" style="color:${color||'#6c5ce7'}">${esc(name)}</span><span>${esc(text)}</span>`;
  box.appendChild(div);
  while(box.children.length>80)box.removeChild(box.firstChild);
  if(nearBottom)box.scrollTop=box.scrollHeight;
  const fsb=document.getElementById('fsChatMessages');if(fsb&&box.id==='chatMessages'){const c=div.cloneNode(true);fsb.appendChild(c);while(fsb.children.length>80)fsb.removeChild(fsb.firstChild);fsb.scrollTop=fsb.scrollHeight;}
}
function addDanmaku(name,text,color){
  const layer=document.getElementById('danmakuLayer');
  const item=document.createElement('div');
  item.className='danmaku-item';
  item.style.top=Math.random()*60+'%';item.style.color=color||'#fff';
  item.textContent=`${name}: ${text}`;
  const dur=8+Math.random()*4;item.style.animationDuration=dur+'s';
  layer.appendChild(item);setTimeout(()=>item.remove(),dur*1000);
}
function showMGiftToast(d){/* gift-anim 已展示，避免重复 */}
function showGiftAnim(d){
  const ov=document.getElementById('giftOverlay');
  const div=document.createElement('div');div.className='gift-anim';
  div.innerHTML=`${d.giftIcon} ${esc(d.name)} 送出 ${d.giftName}！`;
  ov.appendChild(div);
  while(ov.children.length>3)ov.removeChild(ov.firstChild);
  const dur=(typeof d.duration==='number'&&d.duration>0)?d.duration:2500;
  setTimeout(()=>{div.classList.add('ga-fade');setTimeout(()=>div.remove(),500);},dur-500);
}
function openRecharge(){document.getElementById('rechargeModal').style.display='flex';}
function closeRecharge(){document.getElementById('rechargeModal').style.display='none';}
function openMobileGifts(){document.getElementById('mobileGiftSheet').style.display='block';}
function closeMobileGifts(){document.getElementById('mobileGiftSheet').style.display='none';}

async function doRecharge(btn){
  btn.textContent='支付中...';btn.disabled=true;
  const res=await fetch('/api/recharge',{method:'POST',headers:{'Content-Type':'application/json',...authH()},body:JSON.stringify({amount:selectedRechargeAmount,method:selectedPayMethod})});
  const d=await res.json();
  btn.textContent='确认充值';btn.disabled=false;
  if(d.code===0)closeRecharge();
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>

  <div class="fsc-msgs" id="fsChatMessages"></div>
  <div class="fsc-input-row">
    <input type="text" id="fsInput" placeholder="说点什么..." maxlength="200" onkeydown="if(event.key==='Enter')sendFsDanmaku()">
    <button onclick="sendFsDanmaku()">发送</button>
  </div>
